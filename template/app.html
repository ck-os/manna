<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3ECE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Manna">
<meta name="description" content="A short daily Bible reading for the morning.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<link rel="stylesheet" href="app.css?v=3">
<title>{{TITLE}}</title>
</head>
<body>
<div class="app" id="app">
  <div class="room" aria-hidden="true">
    <div class="bloom"></div>
    <div class="window"><i></i><i></i><i></i><i></i></div>
    <canvas id="dust"></canvas>
  </div>

  <section class="screen" id="s-today" aria-label="Today">
    <div class="navbar" data-nav><span></span><span class="t">Today</span><span></span></div>
    <div class="wrap">
      <div class="large">
        <div>
          <div class="k" id="t-date"></div>
          <h1>Today</h1>
        </div>
        <svg class="cup" viewBox="0 0 44 52" aria-hidden="true">
          <path class="wisp" d="M17 20c-3-4 3-6 0-10s2-6 0-8"/>
          <path class="wisp b" d="M26 20c-3-4 3-6 0-10s2-6 0-8"/>
          <path d="M9 26h24v9a10 10 0 0 1-10 10h-4A10 10 0 0 1 9 35z" fill="var(--crema)" stroke="var(--oak)" stroke-width="1.3"/>
          <path d="M33 29h3a4 4 0 0 1 0 8h-3" fill="none" stroke="var(--oak)" stroke-width="1.3"/>
          <ellipse cx="21" cy="26" rx="12" ry="2.2" fill="#5A3F2E" stroke="var(--oak)" stroke-width="1.1"/>
        </svg>
      </div>
    </div>
    <div class="pills" role="tablist" aria-label="Today's sections">
      <div class="pills-in">
        <button type="button" role="tab" class="pill" data-p="0" aria-selected="true">Summary</button>
        <button type="button" role="tab" class="pill" data-p="1" aria-selected="false">Read</button>
        <button type="button" role="tab" class="pill" data-p="2" aria-selected="false">Understand</button>
        <button type="button" role="tab" class="pill" data-p="3" aria-selected="false">Live It</button>
        <button type="button" role="tab" class="pill" data-p="4" aria-selected="false">Tonight</button>
      </div>
    </div>
    <div class="wrap" id="panels">
      <div class="panel" data-panel="0" role="tabpanel" aria-label="Summary" id="p0"></div>
      <div class="panel" data-panel="1" role="tabpanel" aria-label="Read" id="p1" hidden></div>
      <div class="panel" data-panel="2" role="tabpanel" aria-label="Understand" id="p2" hidden></div>
      <div class="panel" data-panel="3" role="tabpanel" aria-label="Live It" id="p3" hidden></div>
      <div class="panel" data-panel="4" role="tabpanel" aria-label="Tonight" id="p4" hidden></div>
      <div class="light-line">
        <button type="button" data-ref="John 8:12">“I am the <span>light</span> of the world.”<small>John 8:12</small></button>
      </div>
      <div class="stamp" id="stamp"></div>
    </div>
  </section>

  <section class="screen" id="s-bible" aria-label="Bible" hidden>
    <div id="b-home">
      <div class="navbar" data-nav><span></span><span class="t">Bible</span><span></span></div>
      <div class="wrap">
        <div class="large"><div><div class="k">Berean Standard Bible</div><h1>Bible</h1></div></div>
        <form class="search" id="search-form" role="search" autocomplete="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="q" type="search" enterkeyhint="search" placeholder="John 3:16, Psalm 23, or a word" aria-label="Look up a verse or search a word">
          <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>×</button>
        </form>
        <div class="hint" id="hint">Type a reference like <b>Rom 8:28–39</b>, or any word to search all of Scripture.</div>
        <div id="results" class="sec" hidden>
          <div class="sec-h"><span id="results-h">Results</span></div>
          <div class="group" id="results-list"></div>
        </div>
        <div id="browse">
          <div class="sec" id="continue-wrap" hidden>
            <div class="sec-h"><span>Continue reading</span></div>
            <div class="group"><button class="li" type="button" id="continue"><span class="m"><b id="continue-t"></b><span>Pick up where you left off</span></span><svg class="chev" viewBox="0 0 8 13"><polyline points="1.5 1.5 6.5 6.5 1.5 11.5"/></svg></button></div>
          </div>
          <div class="sec">
            <div class="seg" role="tablist" aria-label="Testament">
              <button type="button" role="tab" id="seg-ot" aria-selected="true">Old Testament</button>
              <button type="button" role="tab" id="seg-nt" aria-selected="false">New Testament</button>
            </div>
          </div>
          <div class="sec" style="margin-top:14px"><div class="group" id="books"></div></div>
        </div>
      </div>
    </div>
    <div id="b-reader" hidden>
      <div class="navbar always" data-nav>
        <button class="back" type="button" id="back"><svg viewBox="0 0 12 20"><polyline points="10 2 2 10 10 18"/></svg><span id="back-t">Bible</span></button>
        <span class="t" id="reader-t"></span><span></span>
      </div>
      <div class="wrap reader">
        <h2 id="r-h"></h2>
        <div class="meta" id="r-meta"></div>
        <div class="flow" id="r-flow"></div>
        <div class="pager">
          <button type="button" id="r-prev"><small>Previous</small><span id="r-prev-t"></span></button>
          <button type="button" class="nx" id="r-next"><small>Next</small><span id="r-next-t"></span></button>
        </div>
        <div class="src">Berean Standard Bible (BSB) · public domain</div>
      </div>
    </div>
  </section>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
    <div class="grabber"></div>
    <div class="sheet-h"><b id="sheet-t"></b><button type="button" id="sheet-x">Done</button></div>
    <div class="grid" id="grid"></div>
  </div>

  <nav class="tabbar" role="tablist" aria-label="Manna">
    <button type="button" role="tab" id="tab-today" aria-selected="true">
      <svg viewBox="0 0 26 26"><path d="M5 11h14v5a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6z"/><path d="M19 13h1.5a2.5 2.5 0 0 1 0 5H19"/><path d="M10 7c-1-1.5 1-2.5 0-4M14 7c-1-1.5 1-2.5 0-4"/></svg>Today</button>
    <button type="button" role="tab" id="tab-bible" aria-selected="false">
      <svg viewBox="0 0 26 26"><path d="M13 6.5C11 5 8 4.5 4 5v14c4-.5 7 0 9 1.5 2-1.5 5-2 9-1.5V5c-4-.5-7 0-9 1.5z"/><path d="M13 6.5v14"/></svg>Bible</button>
  </nav>
</div>
<script type="application/json" id="edition">/*EDITION_JSON*/{}</script>
<script src="app.js?v=3"></script>
</body>
</html>
